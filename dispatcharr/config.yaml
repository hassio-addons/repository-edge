name: Dispatcharr
version: 2d9df5b
slug: dispatcharr
description: Manage IPTV streams, EPG data and DVR recordings
url: https://github.com/hassio-addons/app-dispatcharr
ingress: true
ingress_port: 1337
ingress_stream: true
panel_icon: mdi:television-play
hassio_api: true
init: false
arch:
- aarch64
- amd64
backup: cold
backup_exclude:
- '**/cache/**'
- '**/logs/**'
- '**/recordings/**'
video: true
map:
- type: media
  read_only: false
- type: share
  read_only: false
- type: ssl
  read_only: true
ports:
  9191/tcp: 9191
ports_description:
  9191/tcp: Web interface & API, and where players, Plex, Jellyfin, Emby and HDHomeRun
    clients connect
options:
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  base_url: url?
  ssl: bool
  certfile: str
  keyfile: str
image: ghcr.io/hassio-addons/dispatcharr
