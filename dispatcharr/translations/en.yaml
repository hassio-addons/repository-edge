---
configuration:
  log_level:
    name: Log level
    description: >-
      Controls the level of log output by the app and can be changed to be
      more or less verbose, which might be useful when you are dealing with
      an unknown issue. Each level automatically includes the messages of a
      more severe level.
  base_url:
    name: Base URL
    description: >-
      The address players, Plex, Emby, Jellyfin and anything else outside Home
      Assistant reach this app at, for example `http://192.168.1.10:9191`. It
      is what the playlist, guide and HDHomeRun links shown in the interface
      are built from. Leave it empty and this app works it out from your
      network, which is right unless you put a reverse proxy in front of it or
      reach it by a name.
  ssl:
    name: SSL
    description: >-
      Enables/Disables encrypted SSL (HTTPS) for direct access to the app.
      This setting has no effect on the Ingress service.
  certfile:
    name: Certificate file
    description: >-
      The certificate file to use for SSL. The file must be stored in the
      `/ssl/` directory.
  keyfile:
    name: Private key file
    description: >-
      The private key file to use for SSL. The file must be stored in the
      `/ssl/` directory.
network:
  9191/tcp: >-
    Web interface and API, and the address everything that plays a stream
    connects to: the playlist and guide outputs, the HDHomeRun tuner Plex,
    Emby and Jellyfin discover, and the Xtream Codes API. Ingress is for
    browsers; this port is what devices need.
