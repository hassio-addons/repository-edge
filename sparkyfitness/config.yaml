name: SparkyFitness
version: 04e43d0
slug: sparkyfitness
description: Self-hosted food, exercise, sleep and body measurement tracker
url: https://github.com/hassio-addons/app-sparkyfitness
homeassistant: 2026.2.0
ingress: true
ingress_stream: true
init: false
panel_icon: mdi:run-fast
arch:
- aarch64
- amd64
backup: cold
map:
- type: ssl
  read_only: true
ports:
  3004/tcp: null
ports_description:
  3004/tcp: Web interface & API (not required for Ingress)
options:
  ingress_auto_login: true
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
  env_vars: []
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  ingress_auto_login: bool
  home_assistant_url: url?
  ssl: bool
  certfile: str
  keyfile: str
  env_vars:
  - name: match(^[A-Z][A-Z0-9_]*$)
    value: str
image: ghcr.io/hassio-addons/sparkyfitness
